[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-governed-workflow-twin"
version = "0.2.1"
description = "Public reference implementation of governed agentic workflow execution."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
include = ["sentinel_ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
