name: Governance reference tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run governance tests
        run: pytest -q
      - name: Check generated scenario contract and PR description
        run: python -m scripts.sync_demo_scenarios --check --github-event "$GITHUB_EVENT_PATH"
      - name: Test demo client
        run: |
          node --check --input-type=module < docs/xray2.js
          node --test tests/test_demo_client.mjs
